global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 3h
    timeout server 3h

# =========================================================================
# Balanceador para tráfico de mensajería AMQP (Puerto 5672)
# =========================================================================
frontend rabbitmq_amqp_frontend
    bind *:5672
    default_backend rabbitmq_amqp_backend

backend rabbitmq_amqp_backend
    mode tcp
    balance roundrobin
    # Las comprobaciones 'check' detectan inmediatamente si un nodo cae
    server rabbit1 rabbitmq-1:5672 check
    server rabbit2 rabbitmq-2:5672 check

# =========================================================================
# Balanceador para Interfaz Web de Gestión (Management UI - Puerto 15672)
# =========================================================================
frontend rabbitmq_mgmt_frontend
    bind *:15672
    mode http
    default_backend rabbitmq_mgmt_backend

backend rabbitmq_mgmt_backend
    mode http
    balance roundrobin
    server rabbit1 rabbitmq-1:15672 check
    server rabbit2 rabbitmq-2:15672 check
